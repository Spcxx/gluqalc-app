name: gluqalc_app
description: "GluQalc App"
publish_to: 'none'
version: 0.0.1

config_name:
  name: "GluQalc"

environment:
  sdk: ^3.13.2

dependencies:
  envied: ^1.3.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  go_router: ^18.0.0
  intl: ^0.20.3
  logger: ^2.7.0
  riverpod_annotation: ^4.0.6

dev_dependencies:
  build_runner: ^2.16.0
  dart_husky: ^1.8.1
  envied_generator: ^1.3.8
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  rename_app: ^1.6.6
  riverpod_generator: ^4.0.8
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
name: gluqalc_app
description: "GluQalc App"
publish_to: 'none'
version: 0.0.1

config_name:
  name: "GluQalc"

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  envied: ^1.3.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.0
  internet_connection_checker_plus: ^3.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^4.0.6
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  dart_husky: ^1.8.1
  envied_generator: ^1.3.8
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  rename_app: ^1.6.6
  riverpod_generator: ^4.0.8
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"